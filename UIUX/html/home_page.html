<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kbail — Inbox</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/home_page.css">
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="../../assets/clouds.mp4" type="video/mp4">
  </video>
  <div class="glass-layer"></div>

  <div class="layout">
    <aside class="col inbox-col">
      <div class="inbox-head">
        <span class="logo">Kbail</span>
        <h1>Inbox</h1>
      </div>
      <ul class="mail-list" id="inbox-list"></ul>
    </aside>

    <div class="main">
      <header class="topbar">
        <button type="button" class="sync-btn" id="sync-btn">SYNC mail</button>
        <button type="button" class="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <path d="M19.14 12.94a7.49 7.49 0 0 0 .05-.94 7.49 7.49 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54a.49.49 0 0 0-.49-.42h-3.84a.49.49 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.49 7.49 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.49.49 0 0 0 .49.42h3.84a.49.49 0 0 0 .49-.42l.36-2.54c.58-.23 1.13-.54 1.63-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
          </svg>
        </button>
      </header>

      <div class="panes">
        <section class="col summary-col">
          <div class="pane-head"><h2>Summarize</h2></div>
          <div class="pane-body" id="summary-box"></div>
        </section>

        <section class="col full-col">
          <div class="pane-head"><h2>Full Mail</h2></div>
          <div class="pane-body" id="full-box"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="profile-backdrop hidden" id="profile-modal">
    <section class="profile-card" role="dialog" aria-modal="true" aria-label="Profile">
      <button type="button" class="close-btn" id="close-profile" aria-label="Close">×</button>
      <h2 class="profile-title">Profile</h2>

      <div class="account-box">
        <p class="account-label">Account</p>
        <p class="account-email" id="account-email">Loading...</p>
      </div>

      <a href="/auth/logout" class="logout-btn">Logout</a>
    </section>
  </div>

  <script src="../scripts/home_page.js"></script>
</body>
</html>
